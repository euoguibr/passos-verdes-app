<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Passos Verdes</title>
<meta name="description" content="App da comunidade de corrida Passos Verdes, de Magé/RJ: agenda, desafios, enquetes e notícias.">
<meta name="theme-color" content="#EDF1E8" id="tc">
<script>try{var t=localStorage.getItem('pv-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Passos Verdes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (máx. 560px), cabeçalho fixo no topo, abas fixas embaixo; número de peito como cartão do corredor */
:root{
  --bg:#EDF1E8; --surface:#FFFFFF; --sunk:#E2E8DC; --ink:#14241A; --muted:#5A6B5F; --line:#D2DBCB;
  --green:#1E6B3B; --green-soft:#D6E8D9; --on-green:#FFFFFF;
  --ipe:#C98F0E; --ipe-soft:#F6E6B8; --danger:#B3261E;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0E1210; --sunk:#171D19; --ink:#EEF3EF; --muted:#9AA89E; --line:#262E29;
  --green:#5DBB7C; --green-soft:#13291B; --on-green:#04140A;
  --ipe:#E9BE4C; --ipe-soft:#2E2610; --danger:#F2867E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E1210; --sunk:#171D19; --ink:#EEF3EF; --muted:#9AA89E; --line:#262E29;
  --green:#5DBB7C; --green-soft:#13291B; --on-green:#04140A;
  --ipe:#E9BE4C; --ipe-soft:#2E2610; --danger:#F2867E; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{background:#000 url(icons/logo.png) center/cover no-repeat;border-radius:50%;border:1px solid var(--line);flex:none}
.mark{width:40px;height:40px}
.banners{position:relative;margin-bottom:4px}
.bn-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r);background:var(--sunk)}
.bn-track::-webkit-scrollbar{display:none}
.bn-slide{flex:0 0 100%;scroll-snap-align:start;display:block}
.bn-slide img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.bn-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.bn-dots button{appearance:none;border:0;padding:0;width:7px;height:7px;border-radius:999px;background:var(--line);cursor:pointer;transition:width .2s,background .2s}
.bn-dots button[aria-current="true"]{width:20px;background:var(--green)}
.bn-adm{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bn-adm:first-child{border-top:0}
.bn-adm img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--sunk)}
.bn-adm>div{min-width:0}
.push{display:flex;flex-direction:column;gap:10px}
.push .ph{display:flex;gap:12px;align-items:flex-start}
.push .bell{width:40px;height:40px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.push .bell svg{width:22px;height:22px}
.push h3{margin-bottom:2px}
.prefs{display:flex;flex-direction:column}
.pref{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.pref:first-child{border-top:0}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;border:0;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(18px)}
.chk{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink);font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--green);margin:0}
.pic{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--sunk)}
.card>.pic:first-child{margin:-16px -16px 2px;width:calc(100% + 32px);max-width:none;border-radius:var(--r) var(--r) 0 0}
.capa{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);background:var(--sunk);margin-top:16px}
.photo-in{display:flex;flex-direction:column;gap:8px}
.photo-in .prev{width:100%;max-width:280px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden;align-self:flex-start}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.brand b{font-family:var(--display);font-weight:850;font-stretch:72%;font-variation-settings:"wdth" 72;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.brand>div{min-width:0}
.brand b,.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand small{letter-spacing:.06em;font-size:10.5px}}
.who{display:flex;align-items:center;gap:6px;flex:none}
.hbtn{appearance:none;border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
.hbtn svg{width:22px;height:22px}
.hbtn[aria-current="page"]{color:var(--green);background:var(--green-soft)}
.avt{border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;overflow:hidden}
.hbtn .avt{border:2px solid var(--line)}
.hbtn[aria-current="page"] .avt{border-color:var(--green)}
.bib{cursor:pointer}
.bib-hint{display:block;text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.prof-head{display:flex;gap:16px;align-items:center}
.prof-head>div{min-width:0}
.prof-head h1{font-family:var(--display);font-weight:850;font-stretch:72%;font-variation-settings:"wdth" 72;text-transform:uppercase;font-size:34px;line-height:1;margin:0 0 6px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:850;font-stretch:72%;font-variation-settings:"wdth" 72;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border:0;border-top:1px solid var(--line);font-weight:600;background:none;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-size:16px}
.linkrow:first-child{border-top:0}
.linkrow svg{width:18px;height:18px;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;justify-content:center}
.overlay .in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.onb-logo{width:88px;height:88px;border-radius:22px}
.mcard{position:relative;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mcard .band{background:var(--green);color:var(--on-green);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:10px 16px;display:flex;justify-content:space-between;gap:8px}
.mcard .body{padding:20px 18px;display:flex;gap:16px;align-items:center}
.mcard .body>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.mcard .nm{font-family:var(--display);font-weight:850;font-stretch:70%;font-variation-settings:"wdth" 70;text-transform:uppercase;font-size:32px;line-height:1;overflow-wrap:anywhere}
.mcard .live{position:relative;overflow:hidden;background:var(--sunk);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.mcard .live::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(93,187,124,.35) 50%,transparent 70%);background-size:220% 100%;animation:shine 2.4s linear infinite}
.mcard .live>*{position:relative}
.dot-live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes pulse{50%{opacity:.25}}
.partner{flex-direction:row;align-items:flex-start;gap:14px}
.partner .plogo{width:60px;height:60px;border-radius:14px;object-fit:cover;background:var(--sunk);flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.partner>div{min-width:0;display:flex;flex-direction:column;gap:6px;flex:1}
.benef{align-self:flex-start;background:var(--ipe-soft);color:var(--ipe);font-weight:800;font-size:14px;padding:4px 10px;border-radius:8px}
.logos{display:flex}
.logos img,.logos span{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);margin-left:-8px;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.logos>:first-child{margin-left:0}

/* Tipografia */
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.h-display{font-family:var(--display);font-weight:850;font-stretch:70%;font-variation-settings:"wdth" 70;text-transform:uppercase;font-size:clamp(40px,11vw,58px);line-height:.92;margin:6px 0 10px;text-wrap:balance;letter-spacing:.005em}
h2.sec{font-family:var(--display);font-weight:800;font-stretch:78%;font-variation-settings:"wdth" 78;text-transform:uppercase;font-size:22px;letter-spacing:.02em;margin:0;line-height:1.1}
h3{font-size:17px;margin:0;line-height:1.3;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:44ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

main{display:flex;flex-direction:column;gap:28px;padding-top:20px}
.section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--green);font-weight:600;font-size:14px;cursor:pointer}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.treino{background:var(--green-soft);color:var(--green)}
.chip.corrida{background:var(--ipe-soft);color:var(--ipe)}
.chip.acao{background:var(--sunk);color:var(--ink)}

.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn{text-decoration:none;text-align:center;color:inherit}
a{color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.btn.small{padding:6px 12px;min-height:36px;font-size:13px}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],textarea,select{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:88px;resize:vertical}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}

/* Aviso */
.notice{background:var(--ipe-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}

/* Número de peito */
.bib{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;box-shadow:0 1px 0 var(--line)}
.bib-band{background:var(--green);color:var(--on-green);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:7px 10px}
.bib-num{font-family:var(--display);font-weight:900;font-stretch:66%;font-variation-settings:"wdth" 66;font-size:88px;line-height:.95;padding-top:10px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.bib-name{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:14px;padding:2px 12px 14px;overflow-wrap:anywhere}
.pin{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line)}
.pin.tl{top:38px;left:12px}.pin.tr{top:38px;right:12px}.pin.bl{bottom:12px;left:12px}.pin.br{bottom:12px;right:12px}

/* Evento */
.ev{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:start}
.date{background:var(--sunk);border-radius:10px;text-align:center;padding:8px 4px}
.date .d{font-family:var(--display);font-weight:900;font-stretch:70%;font-variation-settings:"wdth" 70;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.date .m{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.ev-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.people{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-left:-6px;object-fit:cover}
.avs .av:first-child{margin-left:0}

/* Progresso */
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .4s}
.bar.ipe>i{background:var(--ipe)}
.bignum{font-family:var(--display);font-weight:850;font-stretch:72%;font-variation-settings:"wdth" 72;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}

/* Ranking */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:28px 30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.rank li:first-child{border-top:0}
.rank .pos{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.rank li.top1 .pos{color:var(--ipe)}
.rank li.me{background:var(--green-soft);border-radius:8px;padding-inline:8px;margin-inline:-8px}
.rank .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* Enquete / Quiz */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;cursor:pointer;min-height:44px;font-weight:500}
.opt:hover{border-color:var(--green)}
.res{position:relative;border-radius:10px;background:var(--sunk);overflow:hidden;padding:10px 14px;display:flex;justify-content:space-between;gap:10px}
.res>i{position:absolute;inset:0 auto 0 0;background:var(--green-soft)}
.res>span{position:relative;min-width:0}
.res.mine{outline:1.5px solid var(--green)}
.res.right>i{background:var(--green-soft)}
.res.wrong>i{background:var(--ipe-soft)}

.news{display:flex;flex-direction:column;gap:6px}
.news p{margin:0;white-space:pre-line}

/* Abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;gap:4px}
.tab{appearance:none;background:none;border:0;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;min-height:52px}
.tab svg{width:22px;height:22px}
.tab{position:relative}
.tab .badge{position:absolute;top:3px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--danger);color:var(--surface);font-size:10px;font-weight:700;line-height:17px;letter-spacing:0}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;background:none;border-radius:999px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.st{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.st.ok{background:var(--green-soft);color:var(--green)}
.st.wait{background:var(--ipe-soft);color:var(--ipe)}
.st.no{background:var(--sunk);color:var(--danger)}
.lanc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.lanc:first-child{border-top:0}
.check{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check>div{min-width:0}
.check .thumb{width:96px;height:128px;object-fit:cover;border-radius:8px;background:var(--sunk);border:1px solid var(--line);cursor:zoom-in}
.check .nothumb{width:96px;height:128px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:6px}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.prod-grid{grid-template-columns:1fr}}
.prod{padding:0;overflow:hidden;gap:0}
.prod .pimg{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--sunk)}
.prod .noimg{width:100%;aspect-ratio:1;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.prod .pb{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.price{font-family:var(--display);font-weight:850;font-stretch:72%;font-variation-settings:"wdth" 72;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.prod select{min-height:40px;padding:6px 10px}
.prod .btn{width:100%;padding:9px 10px;font-size:14px}
.soldout{opacity:.6}
.pedido{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:10px 0;border-top:1px solid var(--line)}
.pedido:first-of-type{border-top:0}
.pedido>div{min-width:0}
.tab[aria-current="page"]{color:var(--green);background:var(--green-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:14px}
details summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.adm-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.adm-item:first-of-type{border-top:0}
.adm-item>div{min-width:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo mark" role="img" aria-label="Logo Passos Verdes"></span>
      <div><b>Passos Verdes</b><small>Corrida em comunidade · Magé</small></div>
    </div>
    <div class="who" id="who"></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Seções"><div class="tabs-in" id="tabs"></div></nav>
<div class="overlay" id="onb" hidden role="dialog" aria-label="Boas-vindas"></div>
<div class="overlay" id="mcard" hidden role="dialog" aria-label="Cartão de membro"></div>
<div class="toast" id="toast" hidden></div>
<div class="zoom" id="zoom" hidden data-action="closezoom" role="dialog" aria-label="Foto ampliada"><img id="zoom-img" alt="Foto ampliada"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, getDoc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, deleteToken, isSupported as msgSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCumaJKVTwag1FhGoOKFvgm5eLh6PlIi_A",
  authDomain: "passos-verdes-app.firebaseapp.com",
  projectId: "passos-verdes-app",
  storageBucket: "passos-verdes-app.firebasestorage.app",
  messagingSenderId: "237395782308",
  appId: "1:237395782308:web:74d48a7edf0e378bf4d431"
};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const MESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const COLS=['eventos','noticias','desafios','enquetes','quiz','produtos','banners'];
const S={db:null,user:null,uid:null,admin:false,myName:'',ready:false,offline:false,
  eventos:[],noticias:[],desafios:[],enquetes:[],quiz:[],membros:{},info:null,me:null,loaded:{},names:{},
  editNome:false,armed:null,showPast:false,readOnly:false,confirmed:null,pending:{},busyPic:null,
  lancamentos:[],provas:{},banners:[],bnIdx:0,push:'checking',pushBusy:false,parceiros:[],editPar:null,cardOpen:false,onbDone:false,produtos:[],pedidos:[],sel:{},editProd:null,zoom:null};
function getTheme(){try{const t=localStorage.getItem('pv-theme');return t==='light'||t==='dark'?t:'auto'}catch(e){return 'auto'}}
function applyTheme(t){
  try{if(t==='auto')localStorage.removeItem('pv-theme');else localStorage.setItem('pv-theme',t)}catch(e){}
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  syncThemeColor();
}
function syncThemeColor(){const bg=getComputedStyle(document.body).getPropertyValue('--bg').trim();const m=document.getElementById('tc');if(m&&bg)m.setAttribute('content',bg)}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{syncThemeColor()})}catch(e){}
const BLANK=()=>({apelido:'',presencas:{},votos:{},quiz:{},km:{}});

function hoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(iso){if(!iso)return null;const p=String(iso).split('-').map(Number);if(p.length<3)return null;const d=new Date(p[0],p[1]-1,p[2]);return isNaN(d)?null:d}
function fmtLong(iso){const d=pd(iso);return d?d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}):''}
function fmtShort(iso){const d=pd(iso);return d?d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):''}
function kmf(n){return (Math.round((n||0)*10)/10).toLocaleString('pt-BR',{maximumFractionDigits:1})}
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function bibNum(){return S.uid?100+hash(S.uid)%900:'000'}
const AVC=['#2E7D4F','#B07A0A','#3F6E8C','#8C4F3F','#5C6B2E','#6B4F8C'];
function nome(id){const m=S.membros[id];return (m&&(m.apelido||m.nome))||'Corredor(a)'}
function ini(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'PV'}
function saud(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function me(){return S.me||BLANK()}
function aprovados(did){return S.lancamentos.filter(l=>l.desafio===did&&l.status==='aprovado')}
function sumKm(did){let t=0;for(const l of aprovados(did))t+=Number(l.km)||0;return Math.round(t*10)/10}
function nomeL(l){return nome(l.uid)!=='Corredor(a)'?nome(l.uid):(l.nome||'Corredor(a)')}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}

/* ---------- Navegação ---------- */
const VIEWS=['inicio','agenda','desafios','loja','galera','admin','perfil','config','clube'];
const TABS=['inicio','agenda','desafios','loja','galera','admin'];
const ICON={
 inicio:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 desafios:'<path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/>',
 loja:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
 galera:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.5c3 0 6 1.8 6 5"/>',
 admin:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>'};
const LABEL={inicio:'Início',agenda:'Agenda',desafios:'Desafios',loja:'Loja',galera:'Galera',admin:'Organizar'};
let view=(location.hash||'').slice(1);
if(!VIEWS.includes(view)){view='inicio';try{const v=localStorage.getItem('pv-tab');if(VIEWS.includes(v))view=v}catch(e){}}
window.addEventListener('hashchange',()=>{const v=(location.hash||'').slice(1);if(VIEWS.includes(v)&&v!==view)go(v)});
function go(v){view=v;try{localStorage.setItem('pv-tab',v)}catch(e){}try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}

function renderTabs(){
  const list=TABS.filter(v=>v!=='admin'||S.admin);
  $('#tabs').innerHTML=list.map(v=>`<button class="tab" data-go="${v}" ${v===view?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[v]}</svg>${v==='admin'&&pendCount()?`<span class="badge num">${pendCount()}</span>`:''}${LABEL[v]}</button>`).join('');
  $('#who').innerHTML=`<button class="hbtn" data-go="config" aria-label="Configurações" ${view==='config'?'aria-current="page"':''}>${GEAR}</button>${S.uid?`<button class="hbtn" data-go="perfil" aria-label="Meu perfil" ${view==='perfil'?'aria-current="page"':''}>${avatar(S.uid,34)}</button>`:''}`;
}

/* ---------- Render ---------- */
let rq=0;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
function render(){
  if(view==='admin'&&!S.admin&&S.ready)view='inicio';
  const root=$('#view');const saved={};
  document.querySelectorAll('#onb input[id]').forEach(el=>{if(el.value!=='')saved[el.id]=el.value});
  root.querySelectorAll('input[id]:not([type=file]),textarea[id],select[id]').forEach(el=>{if(el.value!=='')saved[el.id]=el.value});
  const fid=document.activeElement&&document.activeElement.id;
  let h='';
  if(view==='perfil')h=vPerfil();else if(view==='config')h=vConfig();else if(view==='clube')h=vClube();else if(view==='agenda')h=vAgenda();else if(view==='loja')h=vLoja();else if(view==='desafios')h=vDesafios();else if(view==='galera')h=vGalera();else if(view==='admin')h=vAdmin();else h=vInicio();
  root.innerHTML=h;
  const ob=onbHtml();const oe=$('#onb');if(ob){oe.innerHTML=ob;oe.hidden=false}else{oe.hidden=true;oe.innerHTML=''}
  renderCard();
  for(const[id,v]of Object.entries(saved)){const el=document.getElementById(id);if(el)el.value=v}
  if(fid){const el=document.getElementById(fid);if(el)el.focus({preventScroll:true})}
  renderTabs();refreshNames();bnSync(false);
}
function visitante(){
  if(!S.ready)return '';
  if(!S.uid)return `<div class="notice stack"><span>Entre com sua conta Google para confirmar presença, votar e entrar no ranking.</span><div><button class="btn primary" data-action="login">Entrar com Google</button></div></div>`;
  if(S.readOnly)return `<div class="notice"><b>Seu acesso está só para ver.</b> O que você marcou não foi salvo. Peça para a organização te dar acesso de edição no app e depois recarregue a página.</div>`;
  return '';
}
function loading(c,txt){return !S.loaded[c]&&!S.offline?`<div class="empty">${txt}</div>`:null}

function vInicio(){
  const m=me();const nm=m.apelido||S.myName||'';
  let h=bannersHtml()+`<section class="section"><p class="eyebrow">${saud()}${nm?', '+esc(nm.split(' ')[0]):''}</p>
   <h1 class="h-display">Bora correr junto?</h1>
   <p class="lede">Agenda, desafios, enquetes e notícias da comunidade que corre em Magé.</p></section>`;
  h+=visitante();
  if(S.uid){
    h+=`<section class="section"><div class="bib" data-go="perfil" role="button" tabindex="0" aria-label="Abrir meu perfil"><div class="bib-band">Passos Verdes · Magé/RJ</div><div class="bib-num">${bibNum()}</div><div class="bib-name">${esc(nm||'Seu nome aqui')}</div><span class="pin tl"></span><span class="pin tr"></span><span class="pin bl"></span><span class="pin br"></span></div><span class="bib-hint">Toque no seu número para ver seu perfil</span></section>`;
    h+=clubeTeaser();
  }
  // Próximo evento
  const prox=S.eventos.filter(e=>(e.data||'')>=hoje()).sort((a,b)=>(a.data+(a.hora||'')).localeCompare(b.data+(b.hora||'')))[0];
  h+=`<section class="section"><div class="sec-head"><h2 class="sec">Próximo encontro</h2><button class="linkbtn" data-go="agenda">Agenda completa</button></div>`;
  h+=loading('eventos','Carregando a agenda…')??(prox?evCard(prox):`<div class="empty">Nenhum encontro marcado ainda. Os próximos treinos e corridas aparecem aqui assim que a organização publicar.</div>`);
  h+=`</section>`;
  // Desafio ativo
  const d=S.desafios.filter(x=>x.ativo).sort((a,b)=>(b.criado||0)-(a.criado||0))[0];
  if(d){const tot=sumKm(d.id),meta=Number(d.meta)||0,pct=meta?Math.min(100,tot/meta*100):0;
    h+=`<section class="section"><div class="sec-head"><h2 class="sec">Desafio do mês</h2><button class="linkbtn" data-go="desafios">Ver ranking</button></div>
    <div class="card"><h3>${esc(d.titulo)}</h3><div class="row" style="justify-content:space-between;align-items:baseline"><span class="bignum">${kmf(tot)} km</span>${meta?`<span class="muted small num">meta da galera: ${kmf(meta)} km</span>`:''}</div>
    ${meta?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}<button class="btn" data-go="desafios">Lançar minha corrida</button></div></section>`}
  // Enquete ativa
  const q=S.enquetes.filter(x=>x.ativa).sort((a,b)=>(b.criado||0)-(a.criado||0))[0];
  if(q)h+=`<section class="section"><div class="sec-head"><h2 class="sec">A galera decide</h2><button class="linkbtn" data-go="galera">Mais</button></div>${pollCard(q)}</section>`;
  // Notícias
  h+=`<section class="section"><h2 class="sec">Notícias</h2>`;
  const ns=[...S.noticias].sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.criado||0)-(a.criado||0));
  h+=loading('noticias','Carregando notícias…')??(ns.length?ns.map(n=>`<article class="card news">${picHtml(n.foto,'pic')}${n.tag?`<span class="chip">${esc(n.tag)}</span>`:''}<h3>${esc(n.titulo)}</h3><p>${esc(n.texto)}</p>${n.data?`<span class="muted small">${esc(fmtLong(n.data))}</span>`:''}</article>`).join(''):`<div class="empty">Sem notícias por enquanto.</div>`);
  h+=`</section>`;
  // Sobre
  const i=S.info;
  if(i){h+=`<section class="section"><h2 class="sec">Sobre o projeto</h2><div class="card">${i.sobre?`<p style="margin:0;white-space:pre-line">${esc(i.sobre)}</p>`:''}
    ${i.instagram||i.whatsapp?`<div class="stack small">${i.instagram?`<div>Instagram: <a href="https://instagram.com/${esc(i.instagram.replace(/^@/,''))}" target="_blank" rel="noopener">@${esc(i.instagram.replace(/^@/,''))}</a></div>`:''}${i.whatsapp?`<div class="row">WhatsApp: <span class="num" style="user-select:all">${esc(i.whatsapp)}</span><button class="btn small" data-action="copy" data-v="${esc(i.whatsapp)}">Copiar</button></div>`:''}</div>`:''}</div></section>`}
  return h;
}

function evCard(e){
  const d=pd(e.data);const ids=Object.keys(S.membros).filter(id=>S.membros[id].presencas&&S.membros[id].presencas[e.id]);
  const vou=!!me().presencas[e.id];const past=(e.data||'')<hoje();
  const tipo=(e.tipo||'Treino');const cls=tipo==='Corrida'?'corrida':tipo==='Ação'?'acao':'treino';
  const avs=ids.slice(0,5).map(id=>avatar(id,28,'av')).join('');
  return `<article class="card">${picHtml(e.foto,'pic')}<div class="ev"><div class="date"><div class="d">${d?d.getDate():'–'}</div><div class="m">${d?MES[d.getMonth()]:''}</div></div>
  <div class="ev-body"><div class="row"><span class="chip ${cls}">${esc(tipo)}</span></div><h3>${esc(e.titulo)}</h3>
  <div class="meta">${d?`<span>${esc(fmtLong(e.data))}</span>`:''}${e.hora?`<span class="num">${esc(e.hora)}</span>`:''}${e.local?`<span>${esc(e.local)}</span>`:''}</div>
  ${e.descricao?`<p style="margin:0" class="small">${esc(e.descricao)}</p>`:''}
  ${e.link?`<a class="small" href="${esc(e.link)}" target="_blank" rel="noopener">Inscrição e detalhes</a>`:''}
  <div class="people">${avs?`<span class="avs">${avs}</span>`:''}<span class="muted small num">${ids.length?ids.length+(ids.length===1?' vai':' vão'):'Ninguém confirmou ainda'}</span></div>
  ${past?'':`<div><button class="btn ${vou?'on':'primary'}" data-action="rsvp" data-id="${esc(e.id)}" ${S.uid?'':'disabled'}>${vou?'✓ Eu vou':'Eu vou'}</button></div>`}
  </div></div></article>`;
}

function vAgenda(){
  let h=`<section class="section"><p class="eyebrow">Agenda</p><h1 class="h-display">Onde a gente se encontra</h1></section>`+visitante();
  const l=loading('eventos','Carregando a agenda…');if(l)return h+l;
  const t=hoje();
  const fut=S.eventos.filter(e=>(e.data||'')>=t).sort((a,b)=>(a.data+(a.hora||'')).localeCompare(b.data+(b.hora||'')));
  const pas=S.eventos.filter(e=>(e.data||'')<t).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(!fut.length)h+=`<div class="empty">Nenhum encontro marcado ainda.</div>`;
  let mes='';
  for(const e of fut){const d=pd(e.data);const k=d?MESL[d.getMonth()]+' '+d.getFullYear():'';if(k!==mes){mes=k;h+=`<p class="eyebrow" style="margin-top:6px">${esc(k)}</p>`}h+=evCard(e)}
  if(pas.length)h+=`<details${S.showPast?' open':''} data-past><summary>Encontros anteriores (${pas.length})</summary><div class="stack" style="margin-top:10px">${pas.map(evCard).join('')}</div></details>`;
  return h;
}

function vDesafios(){
  let h=`<section class="section"><p class="eyebrow">Desafios</p><h1 class="h-display">Cada km conta</h1><p class="lede">Lance seus km com o print da corrida. Depois da conferência da organização, eles entram no ranking e na meta da galera.</p></section>`+visitante();
  const l=loading('desafios','Carregando desafios…');if(l)return h+l;
  const at=S.desafios.filter(x=>x.ativo).sort((a,b)=>(b.criado||0)-(a.criado||0));
  const enc=S.desafios.filter(x=>!x.ativo).sort((a,b)=>(b.criado||0)-(a.criado||0));
  if(!at.length)h+=`<div class="empty">Nenhum desafio rolando agora. Fica de olho que logo vem o próximo.</div>`;
  for(const d of at)h+=desafioCard(d,true);
  if(enc.length)h+=`<details><summary>Desafios encerrados (${enc.length})</summary><div class="stack" style="margin-top:10px">${enc.map(d=>desafioCard(d,false)).join('')}</div></details>`;
  return h;
}
function desafioCard(d,ativo){
  const tot=sumKm(d.id),meta=Number(d.meta)||0,pct=meta?Math.min(100,tot/meta*100):0;
  const by={};for(const l of aprovados(d.id)){by[l.uid]=(by[l.uid]||{uid:l.uid,km:0,l});by[l.uid].km+=Number(l.km)||0}
  const rk=Object.values(by).sort((a,b)=>b.km-a.km);
  const pos=rk.findIndex(r=>r.uid===S.uid);
  const li=(r,i)=>`<li class="${i===0?'top1':''} ${r.uid===S.uid?'me':''}"><span class="pos">${i+1}</span>${avatar(r.uid,30)}<span class="nm">${esc(nomeL(r.l))}${r.uid===S.uid?' (você)':''}</span><span class="num">${kmf(r.km)} km</span></li>`;
  let rh=rk.slice(0,10).map(li).join('');if(pos>=10)rh+=li(rk[pos],pos);
  const meus=S.lancamentos.filter(l=>l.desafio===d.id&&l.uid===S.uid).sort((a,b)=>(b.criado||0)-(a.criado||0));
  const meuOk=meus.filter(l=>l.status==='aprovado').reduce((t,l)=>t+(Number(l.km)||0),0);
  const fid='prova-'+d.id;
  const stl={aprovado:['ok','Aprovado'],pendente:['wait','Aguardando'],recusado:['no','Recusado']};
  const form=ativo&&S.uid?`<form class="stack" data-form="km" data-id="${esc(d.id)}" style="border-top:1px solid var(--line);padding-top:12px">
    <p class="eyebrow" style="margin:0">Lançar corrida</p>
    <div class="grid2"><label for="km-${esc(d.id)}">Km corridos<input type="number" id="km-${esc(d.id)}" min="0.1" max="300" step="0.01" inputmode="decimal" placeholder="Ex.: 5,2" required></label>
    <label for="lk-${esc(d.id)}">Link no Strava (opcional)<input type="url" id="lk-${esc(d.id)}" placeholder="https://strava.app.link/…"></label></div>
    ${photoField(fid,'Print da corrida (obrigatório)')}
    <p class="muted small" style="margin:0">Mande o print do Strava, do relógio ou do app que você usa, mostrando a distância e a data. A organização confere e libera no ranking.</p>
    <div><button class="btn primary" type="submit" ${S.busyPic?'disabled':''}>Enviar para conferência</button></div></form>`:'';
  const mine=meus.length?`<div><p class="eyebrow" style="margin:0 0 4px">Seus lançamentos · <span class="num">${kmf(meuOk)} km aprovados</span></p>${meus.map(l=>{const[c,t]=stl[l.status]||stl.pendente;

function pollCard(p){

  for(const m of Object.values(S.membros)){const v=m.votos&&m.votos[p.id];if(typeof v==='number'&&v<opts.length){counts[v]++;total++}}
  const show=!p.ativa||typeof myv==='number'||!S.uid;

function bannersHtml(){
  const bs=bannerList();if(!bs.length)return '';
  if(S.bnIdx>=bs.length)S.bnIdx=0;
  return `<section class="banners" aria-label="Destaques"><div class="bn-track" id="bn-track">${bs.map((b,i)=>{const img=`<img src="${b.foto}" alt="${esc(b.titulo||'Destaque '+(i+1))}" ${i?'loading="lazy"':''}>`;
    return /^https?:\/\//.test(b.link||'')?`<a class="bn-slide" href="${esc(b.link)}" target="_blank" rel="noopener">${img}</a>`:`<div class="bn-slide">${img}</div>`}).join('')}</div>
    ${bs.length>1?`<div class="bn-dots">${bs.map((b,i)=>`<button data-action="bn" data-i="${i}" aria-label="Destaque ${i+1}" aria-current="${i===S.bnIdx}"></button>`).join('')}</div>`:''}</section>`;

function bnSync(smooth){const t=document.getElementById('bn-track');if(!t)return;const x=S.bnIdx*t.clientWidth;if(Math.abs(t.scrollLeft-x)>2)t.scrollTo({left:x,behavior:smooth?'smooth':'instant'});
  document.querySelectorAll('.bn-dots button').forEach((d,i)=>d.setAttribute('aria-current',String(i===S.bnIdx)))}
let bnHold=0,bnScrollT;
document.addEventListener('scroll',e=>{const t=e.target;if(!(t&&t.id==='bn-track'))return;clearTimeout(bnScrollT);bnScrollT=setTimeout(()=>{const i=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));if(i!==S.bnIdx){S.bnIdx=i;bnSync(false)}},120)},true);
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#bn-track'))bnHold=Date.now()},{passive:true});
setInterval(()=>{
  if(view!=='inicio'||document.hidden)return;const n=bannerList().length;if(n<2)return;
  if(Date.now()-bnHold<8000)return;
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  S.bnIdx=(S.bnIdx+1)%n;bnSync(true);
},5000);

const okPic=u=>typeof u==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(u);
function picHtml(u,cls){return okPic(u)?`<img class="${cls}" src="${u}" alt="" loading="lazy">`:''}
function photoField(id,label,current){
  const p=S.pending[id];const shown=p!==undefined?p:(current||'');
  return `<div class="photo-in"><span class="small" style="font-weight:600;color:var(--muted)">${label}</span>
  ${okPic(shown)?`<img class="prev" src="${shown}" alt="Prévia da foto">`:''}
  <div class="row"><span class="btn small filebtn">${S.busyPic===id?'Preparando…':(okPic(shown)?'Trocar foto':'Escolher foto')}<input type="file" id="${id}" accept="image/*" aria-label="${label}"></span>
  ${okPic(shown)?`<button type="button" class="btn small danger" data-action="rmpic" data-id="${id}">Remover</button>`:''}</div></div>`;
}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej()};i.src=u})}
async function compress(file,small){
  const img=await loadImg(file);let max=small?360:1280,q=small?0.8:0.75,out='';const lim=small?70000:450000;
  for(let t=0;t<6;t++){
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    out=c.toDataURL('image/jpeg',q);if(out.length<lim)return out;
    q-=0.1;max=Math.round(max*0.85);
  }
  if(out.length<900000)return out;throw new Error('grande');
}
document.addEventListener('change',async e=>{
  const el=e.target;if(!(el.matches&&el.matches('input[type=file]'))||!el.files||!el.files[0])return;
  const id=el.id;S.busyPic=id;render();
  try{S.pending[id]=await compress(el.files[0],id==='pf-f'||id==='pa-f')}catch(err){toast('Não deu para usar essa foto. Tente outra em JPG ou PNG.')}
  S.busyPic=null;render();
});

    await S.db.doc('provas/'+id).set({uid:S.uid,foto});

/* ---------- Gravações ---------- */
let wq=Promise.resolve(),writing=0;
function saveMe(mut){
  if(!S.uid||!S.db){toast('Entre com sua conta para participar.');return}
  if(S.readOnly){toast('Seu acesso está só para ver. Nada foi salvo.');render();return}
  const next=JSON.parse(JSON.stringify(me()));mut(next);next.atualizado=Date.now();if(!next.desde)next.desde=Date.now();next.nome=S.myName||'';
  S.me=next;S.membros={...S.membros,[S.uid]:next};render();
  writing++;
  wq=wq.then(()=>S.db.doc('membros/'+S.uid).set(S.me)).then(()=>{S.confirmed=JSON.parse(JSON.stringify(next))}).catch(e=>{
    const ro=e&&e.code==='permission-denied';if(ro)S.readOnly=true;
    S.me=S.confirmed?JSON.parse(JSON.stringify(S.confirmed)):BLANK();
    const m={...S.membros};if(S.confirmed)m[S.uid]=S.me;else delete m[S.uid];S.membros=m;
    toast(ro?'Não foi salvo: seu acesso está só para ver.':'Não deu para salvar agora. Tenta de novo em instantes.');render();
  }).finally(()=>{writing--});
}
async function addTo(col,data,form){
  try{await S.db.collection(col).add({...data,criado:Date.now()});form.reset();form.querySelectorAll('input:not([type=file]),textarea').forEach(el=>el.value='');form.querySelectorAll('input[type=file]').forEach(el=>delete S.pending[el.id]);render();toast('Publicado.');return true}
  catch(e){toast('Não foi possível publicar. '+(e&&e.code==='permission-denied'?'Só quem edita o app pode publicar.':'Tente de novo.'));return false}
}

const checked=id=>!!document.getElementById(id)?.checked;
function resumo(t,n=150){t=String(t||'').replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n-1)+'…':t}
const val=id=>(document.getElementById(id)?.value||'').trim();
const lines=id=>val(id).split('\n').map(s=>s.trim()).filter(Boolean);

    const foto=S.pending['pf-f'];const ig=val('pf-i').replace(/^@?/,'');const st=val('pf-s');
    saveMe(m=>{m.apelido=n;m.bairro=val('pf-b');m.objetivo=val('pf-o');m.pace=pace;m.aniversario=an;m.instagram=ig?'@'+ig:'';m.strava=/^https?:\/\//.test(st)?st:'';if(foto!==undefined)m.foto=foto});
    delete S.pending['pf-f'];toast('Perfil salvo.');
  }
  else if(k==='parceiro'){
    const pa=S.editPar?S.parceiros.find(p=>p.id===S.editPar):null;

    if(pa){S.db.doc('parceiros/'+pa.id).update(data).then(()=>{S.editPar=null;delete S.pending['pa-f'];clearPar();render();toast('Parceiro atualizado.')}).catch(()=>toast('Não foi possível salvar.'))}
    else{const av=checked('pa-av');addTo('parceiros',{...data,ativo:true},f).then(ok=>{if(ok&&av)notificar({tipo:'geral',titulo:'Novo parceiro no Clube: '+data.nome,texto:data.beneficio+' para quem é da Passos Verdes. Toque para ver.',url:'/#clube'})})}
  }
  else if(k==='banner'){
    const foto=S.pending['bn-f'];if(!okPic(foto)){toast('Escolha a imagem do banner.');return}
    addTo('banners',{foto,link:/^https?:\/\//.test(val('bn-l'))?val('bn-l'):'',ordem:val('bn-o')===''?null:Number(val('bn-o')),titulo:val('bn-t')},f);
  }
  else if(k==='produto'){
    const preco=parseFloat(String(val('pr-p')).replace(',','.'));if(!(preco>=0)){toast('Confira o preço.');return}
    const ep=S.editProd?S.produtos.find(p=>p.id===S.editProd):null;
    const foto=S.pending['pr-f']!==undefined?S.pending['pr-f']:(ep?ep.foto||'':'');

    const data={nome:val('pr-n'),preco,descricao:val('pr-d'),tamanhos:splitList(val('pr-t')),cores:splitList(val('pr-c')),linkPagamento:/^https?:\/\//.test(val('pr-l'))?val('pr-l'):'',foto,ordem:ord};
    if(ep){S.db.doc('produtos/'+ep.id).update(data).then(()=>{S.editProd=null;delete S.pending['pr-f'];f.querySelectorAll('input:not([type=file]),textarea').forEach(el=>el.value='');render();toast('Produto atualizado.')}).catch(()=>toast('Não foi possível salvar.'))}
    else{const av=checked('pr-av');addTo('produtos',{...data,esgotado:false},f).then(ok=>{if(ok&&av)notificar({tipo:'loja',titulo:'Novidade na loja: '+data.nome,texto:brl(data.preco)+(data.descricao?' · '+resumo(data.descricao,100):'')+'. Toque para ver.',url:'/#loja'})})}
  }
  else if(k==='desafio'){const av=checked('ds-av');const d={titulo:val('ds-t'),descricao:val('ds-x'),meta:Number(val('ds-m'))||0,inicio:val('ds-i'),fim:val('ds-f'),ativo:true};
    addTo('desafios',d,f).then(ok=>{if(ok&&av)notificar({tipo:'desafios',titulo:'Novo desafio: '+d.titulo,texto:(d.meta?`Meta da galera: ${kmf(d.meta)} km. `:'')+'Bora somar seus km?',url:'/#desafios'})})}
  else if(k==='enquete'){const o=lines('en-o');if(o.length<2){toast('Coloque pelo menos 2 opções.');return}addTo('enquetes',{pergunta:val('en-p'),opcoes:o,ativa:true},f)}
  else if(k==='quiz'){const o=lines('qz-o');const c=parseInt(val('qz-c'),10)-1;if(o.length<2){toast('Coloque pelo menos 2 opções.');return}if(!(c>=0&&c<o.length)){toast('O número da opção certa precisa existir na lista.');return}addTo('quiz',{pergunta:val('qz-p'),opcoes:o,correta:c,explicacao:val('qz-e')},f)}
  else if(k==='info'){S.db.doc('projeto/info').set({sobre:val('in-s'),instagram:val('in-i'),whatsapp:val('in-w')}).then(()=>{render();toast('Salvo.')}).catch(()=>toast('Não foi possível salvar.'))}
});

  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}

  else if(a==='vote')saveMe(m=>m.votos[id]=Number(b.dataset.i));
  else if(a==='unvote')saveMe(m=>delete m.votos[id]);
  else if(a==='quiz')saveMe(m=>m.quiz[id]=Number(b.dataset.i));
  else if(a==='rmpic'){S.pending[id]='';render()}
  else if(a==='onb-go'){
    const needPush=S.push==='default';if(needPush)pushOn();
    const el=document.getElementById('onb-n');const n=(el&&el.value.trim())||((S.myName||'').split(' ')[0])||'';
    if(!me().apelido&&n)saveMe(m=>{m.apelido=n});
    S.onbDone=true;try{localStorage.setItem('pv-onb-'+S.uid,'1')}catch(err){}render();
  }
  else if(a==='card'){S.cardOpen=true;renderCard()}
  else if(a==='card-close'){S.cardOpen=false;renderCard()}
  else if(a==='editpar'){S.editPar=id;delete S.pending['pa-f'];clearPar();render();const p=S.parceiros.find(x=>x.id===id);if(p){const set=(i,v)=>{const el=document.getElementById(i);if(el)el.value=v??''};set('pa-n',p.nome);set('pa-b',p.beneficio);set('pa-r',p.regras);set('pa-e',p.endereco);set('pa-i',p.instagram);set('pa-w',p.whatsapp);set('pa-o',p.ordem)}document.getElementById('pa-n')?.scrollIntoView({block:'center'})}
  else if(a==='cancelpar'){S.editPar=null;delete S.pending['pa-f'];clearPar();render()}
  else if(a==='bn'){S.bnIdx=Number(b.dataset.i)||0;bnHold=Date.now();bnSync(true)}
  else if(a==='theme'){applyTheme(b.dataset.v);render()}
  else if(a==='login')login();
  else if(a==='logout'){await pushForget();try{await signOut(auth)}catch(err){}}
  else if(a==='push-on')pushOn();
  else if(a==='editnome'){S.editNome=true;render();document.getElementById('f-apelido')?.focus()}
  else if(a==='dellanc'){const k='rl'+id;if(S.armed!==k){arm(k);return}S.armed=null;try{await S.db.doc('lancamentos/'+id).delete();try{await S.db.doc('provas/'+id).delete()}catch(err){}toast('Lançamento cancelado.')}catch(err){toast('Não foi possível cancelar.')}}
  else if(a==='aprovar')conferir(id,true);
  else if(a==='pedok'){try{await S.db.doc('pedidos/'+id).update({status:'concluido'})}catch(err){toast('Não foi possível alterar.')}}
  else if(a==='editprod'){S.editProd=id;delete S.pending['pr-f'];document.querySelectorAll('#pr-n,#pr-p,#pr-o,#pr-d,#pr-t,#pr-c,#pr-l').forEach(el=>el.value='');render();const p=S.produtos.find(x=>x.id===id);if(p){const set=(i,v)=>{const el=document.getElementById(i);if(el)el.value=v??''};set('pr-n',p.nome);set('pr-p',p.preco);set('pr-o',p.ordem);set('pr-d',p.descricao);set('pr-t',(p.tamanhos||[]).join(', '));set('pr-c',(p.cores||[]).join(', '));set('pr-l',p.linkPagamento)}document.getElementById('pr-n')?.scrollIntoView({block:'center'})}
  else if(a==='cancelprod'){S.editProd=null;delete S.pending['pr-f'];document.querySelectorAll('#pr-n,#pr-p,#pr-o,#pr-d,#pr-t,#pr-c,#pr-l').forEach(el=>el.value='');render()}
  else if(a==='recusar'){const k='rc'+id;if(S.armed!==k){arm(k);return}S.armed=null;conferir(id,false)}
  else if(a==='zoom'){S.zoom=b.dataset.src||null;renderZoom()}
  else if(a==='closezoom'){S.zoom=null;renderZoom()}
  else if(a==='copy'){try{await navigator.clipboard.writeText(b.dataset.v);toast('Copiado.')}catch(err){toast('Selecione o número e copie.')}}
  else if(a==='del'){const k=b.dataset.col+id;if(S.armed!==k){arm(k);return}S.armed=null;try{await S.db.doc(b.dataset.col+'/'+id).delete();toast('Apagado.')}catch(err){toast('Não foi possível apagar.')}}
  else if(a==='toggle'){const f=b.dataset.f;const x=S[b.dataset.col].find(z=>z.id===id);try{await S.db.doc(b.dataset.col+'/'+id).update({[f]:!x[f]})}catch(err){toast('Não foi possível alterar.')}}

document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details[data-past]'))S.showPast=e.target.open},true);
function renderZoom(){const z=$('#zoom');if(S.zoom){$('#zoom-img').src=S.zoom;z.hidden=false}else{z.hidden=true;$('#zoom-img').removeAttribute('src')}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.zoom){S.zoom=null;renderZoom()}if(S.cardOpen){S.cardOpen=false;renderCard()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.bib[data-go]')){e.preventDefault();go('perfil')}});
let armT;function arm(k){S.armed=k;render();clearTimeout(armT);armT=setTimeout(()=>{S.armed=null;render()},3500)}

/* ---------- Firebase ---------- */
const app=initializeApp(firebaseConfig);
const fs=getFirestore(app);const auth=getAuth(app);
const DB={
  doc:p=>{const r=doc(fs,p);return{
    set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),
    onSnapshot:(n,e)=>onSnapshot(r,s=>n({exists:s.exists(),data:()=>s.data()}),e)}},
  collection:c=>{const r=collection(fs,c);return{
    add:d=>addDoc(r,d),
    onSnapshot:(n,e)=>onSnapshot(r,s=>n({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e)}}
};
S.db=DB;
function newId(c){return doc(collection(fs,c)).id}
/* ---------- Avisos (push) ---------- */
let messaging=null,vapidKey=null;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
async function pushCheck(){
  if(isIOS&&!standalone()){S.push='needs-install';return}
  let ok=false;try{ok=('Notification' in window)&&('serviceWorker' in navigator)&&await msgSupported()}catch(e){}
  if(!ok){S.push='unsupported';return}
  S.push=Notification.permission==='granted'?'granted':Notification.permission==='denied'?'denied':'default';
}
async function pushToken(){
  if(!messaging)messaging=getMessaging(app);
  if(!vapidKey){const r=await fetch('/api/config',{cache:'no-store'});const c=await r.json();vapidKey=c.vapidKey;if(!vapidKey)throw new Error('sem-chave')}
  const reg=await navigator.serviceWorker.ready;
  return getToken(messaging,{vapidKey,serviceWorkerRegistration:reg});
}
async function pushSave(){
  if(!S.uid||Notification.permission!=='granted')return;
  const t=await pushToken();if(!t)throw new Error('sem-token');
  await setDoc(doc(fs,'dispositivos',t),{uid:S.uid,criado:Date.now(),atualizado:Date.now(),plataforma:isIOS?'ios':(/Android/.test(navigator.userAgent)?'android':'outro')});
  try{localStorage.setItem('pv-push',t)}catch(e){}
}
async function pushOn(){
  if(S.pushBusy)return;S.pushBusy=true;render();
  try{
    const p=await Notification.requestPermission();
    if(p==='granted'){await pushSave();S.push='granted';toast('Avisos ativados. Você vai saber de tudo primeiro.')}
    else S.push=p==='denied'?'denied':'default';
  }catch(e){S.push='error';console.warn('push',e)}
  S.pushBusy=false;render();
}
async function pushForget(){
  try{const t=localStorage.getItem('pv-push');if(t){await deleteDoc(doc(fs,'dispositivos',t));localStorage.removeItem('pv-push')}}catch(e){}
  try{if(messaging)await deleteToken(messaging)}catch(e){}
}
async function notificar(msg){
  try{
    const tok=await auth.currentUser.getIdToken();
    const r=await fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(msg)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.erro||('HTTP '+r.status));
    toast(j.enviados?`Aviso enviado para ${j.enviados} ${j.enviados===1?'celular':'celulares'}.`:'Publicado. Ninguém ativou os avisos ainda.');
    return true;
  }catch(e){toast('O aviso não saiu: '+(e.message||'tente de novo.'));return false}
}

async function login(){
  const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p)}
  catch(e){
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){try{await signInWithRedirect(auth,p)}catch(err){toast('Não deu para entrar. Tente de novo.')}}
    else if(!(e&&e.code==='auth/popup-closed-by-user'||e&&e.code==='auth/cancelled-popup-request'))toast('Não deu para entrar. Tente de novo.');
  }
}
for(const c of COLS)DB.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded[c]=true;schedule()},()=>{S.loaded[c]=true;schedule()});
DB.doc('projeto/info').onSnapshot(s=>{S.info=s.exists?s.data():null;schedule()},()=>{});
let unsubM=null,unsubL=null,unsubP=null,unsubO=null,unsubC=null;
onAuthStateChanged(auth,async u=>{
  for(const u of [unsubM,unsubL,unsubP,unsubO,unsubC])if(u)u();unsubM=unsubL=unsubP=unsubO=unsubC=null;S.parceiros=[];S.onbDone=false;S.cardOpen=false;S.lancamentos=[];S.provas={};S.pedidos=[];
  S.uid=u?u.uid:null;S.myName=u?(u.displayName||''):'';S.admin=false;S.readOnly=false;S.confirmed=null;
  S.me=u?BLANK():null;S.membros={};
  if(u){
    try{const a=await getDoc(doc(fs,'admins',(u.email||'').toLowerCase()));S.admin=a.exists()}catch(e){}
    unsubM=DB.collection('membros').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});
      if(S.uid&&m[S.uid])S.confirmed={...BLANK(),...JSON.parse(JSON.stringify(m[S.uid]))};
      if(S.uid&&writing===0&&m[S.uid])S.me=JSON.parse(JSON.stringify(S.confirmed));
      if(S.uid&&S.me&&(m[S.uid]||writing>0))m[S.uid]=S.me;S.membros=m;S.loaded.membros=true;schedule()},()=>{});
    unsubC=DB.collection('parceiros').onSnapshot(s=>{S.parceiros=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>{});
    unsubL=DB.collection('lancamentos').onSnapshot(s=>{S.lancamentos=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>{});
    if(S.admin){
      unsubP=onSnapshot(collection(fs,'provas'),s=>{const p={};s.docs.forEach(d=>{p[d.id]=d.data()});
        for(const l of S.lancamentos)if(l.status==='pendente'&&!(l.id in p))p[l.id]=null;S.provas=p;schedule()},()=>{});
      unsubO=DB.collection('pedidos').onSnapshot(s=>{S.pedidos=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>{});
    }
  }
  S.ready=true;render();syncThemeColor();
  if(u){await pushCheck();render();if(S.push==='granted')pushSave().catch(e=>console.warn('push',e))}
});
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
